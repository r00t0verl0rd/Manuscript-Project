<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#053312" />
    <title>MANUSCRIPT PROJECT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Russo+One&display=swap" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="partners.css" />
    <script>
        (function () {
            var lang = (navigator.language || navigator.languages && navigator.languages[0] || "")
                .toLowerCase()
                .indexOf("ru") === 0 ? "ru" : "en";
            var link = document.createElement("link");
            link.rel = "preload";
            link.href = "locales/" + lang + ".json";
            link.as = "fetch";
            link.crossOrigin = "anonymous";
            document.head.appendChild(link);

            window.__i18nReady = new Promise(function (resolve) {
                window.__i18nResolve = resolve;
            });

            var fontsReady = document.fonts && document.fonts.ready
                ? Promise.race([
                    document.fonts.ready,
                    new Promise(function (resolve) { setTimeout(resolve, 1200); })
                ])
                : Promise.resolve();

            Promise.all([fontsReady, window.__i18nReady]).then(function () {
                if (document.body) {
                    document.body.classList.add("content-ready");
                } else {
                    document.addEventListener("DOMContentLoaded", function () {
                        document.body.classList.add("content-ready");
                    });
                }
            });
        })();
    </script>
    <style>
        body {
            opacity: 0;
            transition: opacity 0.45s ease;
        }

        body.content-ready {
            opacity: 1;
        }

        #loader-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            z-index: 99999;
            background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan), var(--neon-purple));
            background-size: 200% 100%;
            animation: loaderSlide 1.2s ease-in-out infinite;
            transition: opacity 0.5s ease;
        }

        body.content-ready #loader-bar {
            opacity: 0;
            pointer-events: none;
        }

        @keyframes loaderSlide {
            0% {
                background-position: -200% 0;
            }

            100% {
                background-position: 200% 0;
            }
        }
    </style>
</head>


<body>
    <!-- Индикатор загрузки (тонкая неоновая линия сверху) -->
    <div id="loader-bar"></div>

    <!-- Фоновые частицы (canvas) -->
    <div id="particles-js"></div>

    <!-- Шапка overlay (fix) -->
    <header class="header-container">
        <div class="header-row-top">
            <div id="about-mini-section">
                <button id="contacts-btn" class="simple-btn" type="button" data-i18n="contacts_btn"></button>
                <button id="more-btn" class="simple-btn" type="button" data-i18n="more_btn"></button>
                <button id="road-map-btn" class="simple-btn" type="button" data-i18n="road_map_btn"></button>
            </div>
            <div>
                <button id="lang-toggle" class="lang-flag-btn" type="button"
                    data-i18n-aria-label="switch_language">🇬🇧</button>
            </div>
        </div>
        <div class="header-row-bottom">
            <button id="meme-part-btn" class="simple-btn" type="button" data-i18n="meme_part_btn"></button>
            <div class="header-wallet-block">
                <div class="wallet-info" data-i18n="wallet_balance"></div>
                <div id="wallet-mini-section">
                    <button id="connect-wallet-btn" class="simple-btn" type="button"
                        data-i18n="connect_wallet_btn"></button>
                </div>
            </div>
        </div>
    </header>

    <!-- Контент: шапка вынесена за пределы #content -->
    <div id="content">
        <main class="main-wrapper">
            <h1 data-i18n="header_title"></h1>

            <div id="project-info" class="simple-card">
                <button id="close-info-btn" class="close-icon" type="button"
                    data-i18n-aria-label="close_btn">&times;</button>
                <h2 data-i18n="info_title"></h2>
                <p class="content-text" data-i18n="info_desc"></p>
                <div class="intent-more-wrapper">
                    <button id="intent-more-btn" class="simple-btn" type="button" data-i18n="intent_more_btn"></button>
                </div>
            </div>


            <div id="ideas-feed">
                <h2 data-i18n="community_ideas_title"></h2>

                <div class="sort-row">
                    <div class="sort-label" aria-hidden="true" data-i18n-title="sort_title"></div>
                    <div class="type-selector" role="group" data-i18n-aria-label="sort_aria_label">
                        <label class="radio-label">
                            <input type="radio" name="sort" value="diamonds_desc" checked />
                            <span class="radio-custom" data-i18n="sort_max"></span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="sort" value="diamonds_asc" />
                            <span class="radio-custom" data-i18n="sort_min"></span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="sort" value="created_desc" />
                            <span class="radio-custom" data-i18n="sort_new"></span>
                        </label>
                    </div>
                </div>

                <div class="feed-columns">
                    <div class="feed-column" data-feed-col="1">
                        <div id="feed-1"></div>
                    </div>
                    <div class="feed-column" data-feed-col="2">
                        <div id="feed-2"></div>
                    </div>
                    <div class="feed-column" data-feed-col="3">
                        <div id="feed-3"></div>
                    </div>
                </div>
            </div>

            <!-- Партнёры (всегда на всех страницах) -->
            <section class="partners-section" data-i18n-aria-label="partners_aria_label">
                <h2 data-i18n="partners_title"></h2>

                <div class="partners-logos">
                    <a class="partner-logo" href="https://worldcitizengov.org/" target="_blank" rel="noopener noreferrer">
                        <span class="partner-logo-name">World Citizen Government</span>
                    </a>
                    <a class="partner-logo" href="https://www.thevenusproject.com/" target="_blank" rel="noopener noreferrer">
                        <span class="partner-logo-name">The Venus Project</span>
                    </a>
                    <a class="partner-logo" href="https://www.milliondollarhomepage.com/" target="_blank" rel="noopener noreferrer">
                        <span class="partner-logo-name">Million Dollar Homepage</span>
                    </a>
                    <a class="partner-logo" href="https://bitcoin.org/" target="_blank" rel="noopener noreferrer">
                        <span class="partner-logo-name">Bitcoin.org</span>
                    </a>
                    <a class="partner-logo" href="https://greatawakeningmap.co/" target="_blank" rel="noopener noreferrer">
                        <span class="partner-logo-name">Great Awakening Map</span>
                    </a>
                </div>
            </section>
        </main>
    </div>

    <footer>

        <p>&copy; <span id="current-year"></span> <span data-i18n="footer_project_name"></span>.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js" defer></script>
    <script src="i18n.js" defer></script>
    <script src="script.js" defer></script>
    <script src="particles-config.js" defer></script>
</body>

</html>
