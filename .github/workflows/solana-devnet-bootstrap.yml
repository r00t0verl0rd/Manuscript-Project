name: Bootstrap Solana Testnet

on:
  pull_request:
    paths:
      - ".github/workflows/solana-testnet-bootstrap.yml"
  push:
    branches:
      - "feat/solana-idea-contract-v01"
    paths:
      - ".github/workflows/solana-testnet-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    if: "!contains(github.event.head_commit.message, '[skip deploy]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Solana + Anchor toolchain
        shell: bash
        run: |
          set -euo pipefail

          curl --proto '=https' --tlsv1.2 -sSfL https://solana-install.solana.workers.dev | bash

          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$HOME/.avm/bin:$PATH"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

          avm install 1.2.0
          avm use 1.2.0

          rustc --version
          solana --version
          anchor --version
          node --version
          npm --version

      - name: Generate temporary deploy wallet and stable Program ID
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$HOME/.avm/bin:$PATH"

          mkdir -p /tmp/manuscript-solana
          chmod 700 /tmp/manuscript-solana

          solana-keygen new             --outfile /tmp/manuscript-solana/deployer.json             --no-bip39-passphrase             --force

          cd solana
          mkdir -p target/deploy

          solana-keygen new             --outfile target/deploy/manuscript_ideas-keypair.json             --no-bip39-passphrase             --force

          anchor keys sync

          PROGRAM_ID="$(solana address -k target/deploy/manuscript_ideas-keypair.json)"
          echo "PROGRAM_ID=$PROGRAM_ID" >> "$GITHUB_ENV"
          echo "Generated Program ID: $PROGRAM_ID"

      - name: Build program
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$HOME/.avm/bin:$PATH"

          cd solana
          anchor build

      - name: Fund temporary Testnet deploy wallet
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$HOME/.avm/bin:$PATH"

          solana config set             --url testnet             --keypair /tmp/manuscript-solana/deployer.json

          echo "Temporary deployer: $(solana address)"

          for attempt in 1 2 3 4; do
            echo "Airdrop attempt $attempt"
            solana airdrop 2 || true
            sleep 4
          done

          BALANCE_LAMPORTS="$(solana balance --lamports | awk '{print $1}')"
          echo "Balance after standard faucet attempts: $BALANCE_LAMPORTS lamports"

          if [ "$BALANCE_LAMPORTS" -lt 800000000 ]; then
            echo "Public Testnet faucet is rate-limited on this runner."
            echo "Falling back to the proof-of-work faucet recommended for automated agents."

            cargo install testnet-pow --locked

            testnet-pow               --keypair-path /tmp/manuscript-solana/deployer.json               --url testnet               mine               --target-lamports 800000000
          fi

          solana balance

      - name: Deploy program to Solana Testnet
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$HOME/.avm/bin:$PATH"

          cd solana

          solana             --url testnet             --keypair /tmp/manuscript-solana/deployer.json             program deploy             target/deploy/manuscript_ideas.so             --program-id target/deploy/manuscript_ideas-keypair.json             --upgrade-authority /tmp/manuscript-solana/deployer.json

          solana --url testnet program show "$PROGRAM_ID"

      - name: Transfer upgrade authority to Manuscript owner wallet
        shell: bash
        env:
          MANUSCRIPT_UPGRADE_AUTHORITY: "JDbR1Kaqfxf9ihit4PArM1EvJqoaQ8WnnyD6sZ4sqZBM"
        run: |
          set -euo pipefail

          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$HOME/.avm/bin:$PATH"

          solana             --url testnet             --keypair /tmp/manuscript-solana/deployer.json             program set-upgrade-authority             "$PROGRAM_ID"             --upgrade-authority /tmp/manuscript-solana/deployer.json             --new-upgrade-authority "$MANUSCRIPT_UPGRADE_AUTHORITY"             --skip-new-upgrade-authority-signer-check

          solana --url testnet program show "$PROGRAM_ID"

      - name: Write and read back one test idea
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$HOME/.avm/bin:$PATH"

          cd solana
          npm install --no-audit --no-fund

          ANCHOR_PROVIDER_URL="https://api.testnet.solana.com"           ANCHOR_WALLET="/tmp/manuscript-solana/deployer.json"           npm run smoke:testnet

      - name: Save public deployment result in the branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "manuscript-agent"
          git config user.email "manuscript-agent@users.noreply.github.com"

          git add             solana/Anchor.toml             solana/programs/manuscript_ideas/src/lib.rs             solana/testnet-deployment.json

          if git diff --cached --quiet; then
            echo "No deployment metadata changes to commit."
            exit 0
          fi

          git commit -m "Sync Solana Testnet deployment [skip deploy]"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Manuscript Solana Testnet bootstrap"
            echo
            echo "- Program ID: `$PROGRAM_ID`"
            echo "- Upgrade authority: `JDbR1Kaqfxf9ihit4PArM1EvJqoaQ8WnnyD6sZ4sqZBM`"
            echo "- Smoke test: idea written and read back successfully"
            echo
            echo "See `solana/testnet-deployment.json` for the public transaction details."
          } >> "$GITHUB_STEP_SUMMARY"
