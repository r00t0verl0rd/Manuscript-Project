name: Testnet balance only

on:
  push:
    branches:
      - "feat/solana-idea-contract-v01"
    paths:
      - ".github/workflows/solana-testnet-balance-push.yml"

permissions:
  contents: read

jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Solana Testnet RPC
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -sS https://api.testnet.solana.com -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"getBalance","params":["JDbR1Kaqfxf9ihit4PArM1EvJqoaQ8WnnyD6sZ4sqZBM",{"commitment":"confirmed"}]}')"
          echo "$RESPONSE"
          python3 -c 'import json,sys; x=json.loads(sys.argv[1]); print("TESTNET_BALANCE_SOL=%.9f"%(x["result"]["value"]/1_000_000_000))' "$RESPONSE"
