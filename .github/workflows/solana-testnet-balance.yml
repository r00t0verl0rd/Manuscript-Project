name: Check Solana Testnet balance

on:
  pull_request:
    paths:
      - ".github/workflows/solana-testnet-balance.yml"

permissions:
  contents: read

jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check owner wallet balance on Testnet
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -sS https://api.testnet.solana.com             -H 'Content-Type: application/json'             -d '{"jsonrpc":"2.0","id":1,"method":"getBalance","params":["JDbR1Kaqfxf9ihit4PArM1EvJqoaQ8WnnyD6sZ4sqZBM",{"commitment":"confirmed"}]}')"
          echo "$RESPONSE"
          LAMPORTS="$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"]["value"])')"
          python3 - "$LAMPORTS" <<'PY'
import sys
lamports=int(sys.argv[1])
print(f"TESTNET_BALANCE_SOL={lamports/1_000_000_000:.9f}")
PY
