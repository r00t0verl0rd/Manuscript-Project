name: Build and deploy React to GitHub Pages

on:
  push:
    branches: [feature/react-solar-spring-20261010]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout React source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Preserve old behavior
        run: npm test

      - name: Compile React for GitHub Pages
        run: |
          npm run build
          mv dist/react.index.html dist/index.html

      - name: Check that the React page actually renders in Chrome
        shell: bash
        run: |
          set -euo pipefail
          (npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/manuscript-preview.log 2>&1 & echo $! > /tmp/manuscript-preview.pid)
          trap 'kill "$(cat /tmp/manuscript-preview.pid)" 2>/dev/null || true' EXIT
          for n in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME" || { echo "No Chrome browser for smoke test"; exit 1; }
          timeout 35 "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --disable-gpu --virtual-time-budget=5000 \
            --dump-dom http://127.0.0.1:4173/ > /tmp/manuscript-rendered.html 2> /tmp/manuscript-chrome.log || {
              tail -50 /tmp/manuscript-chrome.log; exit 1;
            }
          if ! grep -q '<h1>MANUSCRIPT PROJECT</h1>' /tmp/manuscript-rendered.html || \
             ! grep -q 'idea-card' /tmp/manuscript-rendered.html; then
            echo 'React failed to render heading and idea cards in a real browser.'
            tail -80 /tmp/manuscript-chrome.log
            head -c 1800 /tmp/manuscript-rendered.html
            exit 1
          fi
          echo 'Real browser smoke test: React heading and cards visible.'

      - name: Verify production entry and domain
        run: |
          test -s dist/index.html
          test -s dist/CNAME
          grep -Fxq "manuscript.world" dist/CNAME
          grep -q 'assets/' dist/index.html
          ! grep -q '/src/main.jsx' dist/index.html
          test -n "$(find dist/assets -name '*.js' -print -quit)"
          test -n "$(find dist/assets -name '*.css' -print -quit)"

      # Pages settings currently select a source branch rather than GitHub Actions.
      # Publish the compiled index and assets into that same branch so branch Pages
      # cannot show uncompiled React/JSX. GITHUB_TOKEN commits don't recurse Actions.
      - name: Synchronize built site to Pages branch root
        shell: bash
        run: |
          mkdir -p assets
          rm -f assets/index-*.js assets/index-*.css
          cp dist/index.html index.html
          cp -R dist/assets/. assets/
          git add -A index.html assets
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "Published the latest compiled React website to GitHub Pages [skip ci]"
            git push origin HEAD:feature/react-solar-spring-20261010
          fi

      # GitHub Pages is configured to publish from this branch root.
      # The branch update above triggers its normal Pages deployment.
