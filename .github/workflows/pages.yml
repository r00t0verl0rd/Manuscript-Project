name: Build and deploy React to GitHub Pages

on:
  push:
    branches: [feature/react-solar-spring-20261010]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout React source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Preserve old behavior
        run: npm test

      - name: Compile React for GitHub Pages
        run: |
          npm run build
          mv dist/react.index.html dist/index.html

      - name: Verify production entry and domain
        run: |
          test -s dist/index.html
          test -s dist/CNAME
          grep -Fxq "manuscript.world" dist/CNAME
          grep -q 'assets/' dist/index.html
          ! grep -q '/src/main.jsx' dist/index.html
          test -n "$(find dist/assets -name '*.js' -print -quit)"
          test -n "$(find dist/assets -name '*.css' -print -quit)"

      # Pages settings currently select a source branch rather than GitHub Actions.
      # Publish the compiled index and assets into that same branch so branch Pages
      # cannot show uncompiled React/JSX. GITHUB_TOKEN commits don't recurse Actions.
      - name: Synchronize built site to Pages branch root
        shell: bash
        run: |
          mkdir -p assets
          rm -f assets/index-*.js assets/index-*.css
          cp dist/index.html index.html
          cp -R dist/assets/. assets/
          git add -A index.html assets
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "deploy: publish compiled React site [skip ci]"
            git push origin HEAD:feature/react-solar-spring-20261010
          fi

      - name: Upload compiled site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy compiled React site
        id: deployment
        uses: actions/deploy-pages@v4
