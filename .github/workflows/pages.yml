name: Build and deploy React to GitHub Pages

on:
  push:
    branches:
      - feature/react-solar-spring-20261010
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout React source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Preserve old behavior
        run: npm test

      - name: Compile React for GitHub Pages
        run: npm run build

      - name: Verify production files and custom domain
        shell: bash
        run: |
          test -s dist/index.html
          test -f dist/CNAME
          grep -Fxq "manuscript.world" dist/CNAME
          ! grep -q 'src="/src/main.jsx"' dist/index.html
          ls -lah dist dist/assets

      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Select GitHub Actions as Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow || {
            echo "::warning::Could not switch Pages source automatically. In Settings -> Pages -> Build and deployment select 'GitHub Actions'."
          }

      - name: Deploy build
        id: deployment
        uses: actions/deploy-pages@v4
