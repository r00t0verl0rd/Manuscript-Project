name: Solana program check

on:
  pull_request:
    paths:
      - "solana/**"
      - ".github/workflows/solana-check.yml"
  push:
    branches:
      - main
    paths:
      - "solana/**"
      - ".github/workflows/solana-check.yml"

permissions:
  contents: read

jobs:
  cargo-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: solana

      - name: Check Anchor program
        run: cargo check --manifest-path solana/Cargo.toml
